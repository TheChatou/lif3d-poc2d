; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyUSB1
monitor_port = /dev/ttyUSB1


build_flags =
  -D ESP32_AUDIO_OUT_MODE=1   ; 1 = INTERNAL_DAC → GPIO25 (L) + GPIO26 (R)

lib_deps =
  fastled/FastLED @ ^3.6.0
  sensorium/Mozzi @ ~1.1.1

; Environnement de test isolé, sans Mozzi/GoL — pour diagnostiquer la matrice
; seule. N'importe pas src/main.cpp, aucun risque pour le firmware principal.
; Flash : pio run -e led_test -t upload
; Retour au firmware normal : pio run -e esp32dev -t upload
[env:led_test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyUSB1
monitor_port = /dev/ttyUSB1
build_src_filter = -<*> +<../test_leds/main.cpp>

lib_deps =
  fastled/FastLED @ ^3.6.0

; Test des menus sur la vraie matrice, avec le son (Mozzi) — modules src/ui/ réutilisables.
; Flash : pio run -e ui_test -t upload   (secteur coupé, USB seul)
[env:ui_test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyUSB1
monitor_port = /dev/ttyUSB1
upload_speed = 115200   ; plus lent mais plus fiable sur port USB faible
build_flags =
  -I src
  -D ESP32_AUDIO_OUT_MODE=1   ; 1 = INTERNAL_DAC → GPIO25 (L) + GPIO26 (R)
build_src_filter = -<*> +<ui/> +<gol.cpp> +<audio.cpp> +<../test_ui/main.cpp>

; ⚠ Version EXACTE, validée sur la matrice (led_test). La 3.10.8 a donné une
;   matrice toute blanche le 2026-10-24 — ne pas remettre "^".
lib_deps =
  fastled/FastLED @ 3.10.3
  sensorium/Mozzi @ ~1.1.1
